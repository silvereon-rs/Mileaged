name: mileaged
description: A Flutter app for calculating vehicle mileage (tank to tank method).
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.0
  shared_preferences: ^2.2.0
  in_app_purchase: ^3.2.0
  image_picker: ^1.0.7
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: "mileaged.png"
  image_path: "mileaged.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Honda
      fonts:
        - asset: assets/fonts/Honda-Regular.ttf
